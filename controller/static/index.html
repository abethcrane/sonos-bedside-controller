<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0c12">
<title>sonos-box</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="ui.css?v=cBQW9UjLPjj6T1B8GlIHmUihDYWcqYug.2">
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <g stroke="#2de2e6" stroke-width="1.4">
          <circle cx="6.5" cy="16" r="3.2"/>
          <circle cx="13.5" cy="16" r="3.2"/>
          <circle cx="20.5" cy="16" r="3.2"/>
          <circle cx="27.5" cy="16" r="3.2"/>
        </g>
        <g stroke="#ff2bd6" stroke-width="1.4" stroke-linecap="round">
          <path d="M6.5 13.2v2"/>
          <path d="M13.5 13.2v2"/>
          <path d="M20.5 13.2v2"/>
          <path d="M27.5 13.2v2"/>
        </g>
      </svg>
    </div>
    <h1>sonos-box</h1>
  </div>
  <p class="sub">Sources for the music knob · drag to reorder · ▶ plays on Sonos</p>

  <div class="cols">
    <div class="panel">
      <div class="panel-title">On device</div>
      <div id="active-list"></div>
    </div>
    <div class="panel available">
      <div class="panel-title">Available to add</div>
      <div id="available-list"></div>
    </div>
  </div>

  <div class="save-bar">
    <button class="primary" onclick="save()">Save to device</button>
    <span class="status" id="status"></span>
  </div>

  <div class="panel rooms-panel">
    <div class="panel-title">Room presets</div>
    <p class="sub" style="margin-bottom:12px">ROOMS knob scrolls these; press applies.</p>
    <div id="room-presets"></div>
    <div class="save-bar" style="margin-top:12px">
      <button class="secondary" onclick="addPreset()">+ preset</button>
      <button class="primary" onclick="saveRooms()">Save rooms</button>
      <span class="status" id="rooms-status"></span>
    </div>
  </div>
</div>
<script src="ui.js?v=cBQW9UjLPjj6T1B8GlIHmUihDYWcqYug.2" defer></script>
</body>
</html>
